name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-zip:
    name: Build Release ZIP
    uses: ./.github/workflows/reusable-build-zip.yml
    with:
      zip_name: wp-simple-firewall-${{ github.ref_name }}.zip
      retention_days: 1
    secrets: inherit

  release:
    name: Create GitHub Release
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    needs: build-zip
    permissions:
      actions: read
      contents: write

    steps:
    # This step runs seconds after the upload, and GitHub can take a moment to list a new artifact, so one miss
    # gets a short wait and a second attempt before the release fails.
    - name: Download release ZIP
      id: download-zip
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.build-zip.outputs.artifact_id }}
        path: ${{ github.workspace }}
        skip-decompress: true

    - name: Wait before retrying the download
      if: steps.download-zip.outcome == 'failure'
      run: sleep 15

    - name: Retry downloading release ZIP
      if: steps.download-zip.outcome == 'failure'
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.build-zip.outputs.artifact_id }}
        path: ${{ github.workspace }}
        skip-decompress: true

    - name: Verify release ZIP
      run: |
        cd "${{ github.workspace }}"
        echo "${{ needs.build-zip.outputs.zip_sha256 }}  ${{ needs.build-zip.outputs.zip_name }}" | sha256sum -c -

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ github.workspace }}/${{ needs.build-zip.outputs.zip_name }}
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
