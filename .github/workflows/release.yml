name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-zip:
    name: Build Release ZIP
    uses: ./.github/workflows/reusable-build-zip.yml
    with:
      zip_name: wp-simple-firewall-${{ github.ref_name }}.zip
      retention_days: 1
    secrets: inherit

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-zip
    permissions:
      actions: read
      contents: write

    steps:
    - name: Download release ZIP
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.build-zip.outputs.artifact_name }}
        path: ${{ github.workspace }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ github.workspace }}/${{ needs.build-zip.outputs.zip_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
