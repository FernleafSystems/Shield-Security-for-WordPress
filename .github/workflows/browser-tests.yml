name: Browser Tests

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ develop, 'support/**', main, master, docker-matrix-testing-research ]
  push:
    branches: [ develop, 'support/**' ]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1-5'

jobs:
  changes:
    name: 'Changed File Filters'
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Detect changed file groups
      id: filter
      uses: dorny/paths-filter@v4
      with:
        base: ${{ github.ref_name }}
        filters: .github/ci-path-filters.yml

  playwright-action-router:
    name: 'Playwright ActionRouter'
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Prepare Private Packagist Composer auth
      env:
        PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      run: php .github/scripts/prepare-packagist-composer-auth.php

    - name: Install dependencies
      timeout-minutes: 10
      run: |
        composer install --no-interaction --prefer-dist --optimize-autoloader
        npm ci --no-audit --no-fund

    # Normally under a minute, or seconds from the cache; a mirror that can't be reached fails here, not at the job limit.
    - name: Install Playwright Chromium headless shell
      timeout-minutes: 10
      uses: ./.github/actions/install-playwright-browser
      with:
        browser: chromium
        only-shell: 'true'

    - name: Run ActionRouter browser lane
      run: composer test:browser -- --clean --lanes=2 -- --workers=2

    - name: Clean browser harness resources
      if: always()
      run: composer test:browser:cleanup -- --all --lanes=2

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-action-router-artifacts
        path: |
          playwright-report
          test-results
        if-no-files-found: ignore

  playwright-silentcaptcha-engines:
    name: 'Playwright silentCAPTCHA (${{ matrix.browser }})'
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [ firefox, webkit ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Prepare Private Packagist Composer auth
      env:
        PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      run: php .github/scripts/prepare-packagist-composer-auth.php

    - name: Install dependencies
      timeout-minutes: 10
      run: |
        composer install --no-interaction --prefer-dist --optimize-autoloader
        npm ci --no-audit --no-fund

    - name: Install Playwright engine
      timeout-minutes: 10
      uses: ./.github/actions/install-playwright-browser
      with:
        browser: ${{ matrix.browser }}

    - name: Run silentCAPTCHA browser lane
      run: composer test:browser -- --clean --lanes=1 -- tests/browser/action-router/silentcaptcha-altcha-v2.spec.js tests/browser/action-router/silentcaptcha-cookie-free.spec.js --workers=1 --browser=${{ matrix.browser }}

    - name: Clean browser harness resources
      if: always()
      run: composer test:browser:cleanup -- --all --lanes=1

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-silentcaptcha-${{ matrix.browser }}-artifacts
        path: |
          playwright-report
          test-results
        if-no-files-found: ignore
