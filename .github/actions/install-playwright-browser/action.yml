name: Install Playwright browser
description: >-
  Installs one Playwright browser and the system packages it needs, from the Actions cache when it can. The browser
  is cached per Playwright version, and the packages are cached as a set, saved again whenever apt picks up a new
  version, so a run downloads only what has changed. Run it after npm ci, and give the step a timeout: apt waits a
  long time on each mirror it can't reach.

inputs:
  browser:
    description: 'The browser to install: chromium, firefox or webkit.'
    required: true
  only-shell:
    description: 'For chromium, install only the headless shell.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Work out cache keys
      id: keys
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        ONLY_SHELL: ${{ inputs.only-shell }}
      run: |
        version="$(node -p "require('@playwright/test/package.json').version")"
        target="${BROWSER}"
        if [ "${ONLY_SHELL}" = 'true' ]; then
          target="${BROWSER}-shell"
        fi
        os="${ImageOS:-$(. /etc/os-release && echo "${ID}${VERSION_ID}")}"
        {
          echo "browser=playwright-browser-${RUNNER_OS}-${RUNNER_ARCH}-${version}-${target}"
          echo "apt-prefix=playwright-apt-${os}-${RUNNER_ARCH}-${target}-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cached browser
      id: browser-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.browser }}

    # A package set is named for the package files it holds, which isn't known until apt has run, so the newest set
    # saved for this browser is restored.
    - name: Restore cached system packages
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.keys.outputs.apt-prefix }}
        restore-keys: ${{ steps.keys.outputs.apt-prefix }}

    # apt keeps the packages it downloads in the cached folder, so packages restored there need no download.
    - name: Keep downloaded system packages
      shell: bash
      run: |
        mkdir -p "${HOME}/.cache/playwright-apt/partial"
        printf 'Dir::Cache::Archives "%s/.cache/playwright-apt/";\nAPT::Keep-Downloaded-Packages "true";\n' "${HOME}" \
          | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null

    - name: Install browser and system packages
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        ONLY_SHELL: ${{ inputs.only-shell }}
      run: |
        args=( --with-deps "${BROWSER}" )
        if [ "${ONLY_SHELL}" = 'true' ]; then
          args+=( --only-shell )
        fi
        php bin/run-node-tool.php playwright install "${args[@]}"

    # Saved straight away, so a later test failure doesn't lose them.
    - name: Cache browser
      if: steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.browser }}

    # Cached entries can't be updated, so a set that has changed is saved under a new name: package files apt no longer
    # offers are dropped, and the rest are named by a hash of their file names, which carry their versions.
    - name: Name the system packages
      id: apt-set
      shell: bash
      env:
        PREFIX: ${{ steps.keys.outputs.apt-prefix }}
        RESTORED: ${{ steps.apt-cache.outputs.cache-matched-key }}
      run: |
        sudo apt-get autoclean -qq
        cd "${HOME}/.cache/playwright-apt"
        if compgen -G '*.deb' > /dev/null; then
          key="${PREFIX}$(find . -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)"
          if [ "${key}" != "${RESTORED}" ]; then
            echo "key=${key}" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Cache system packages
      if: steps.apt-set.outputs.key != ''
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.apt-set.outputs.key }}
