x-shield-container-labels: &shield-container-labels
  com.fernleaf.harness: ${SHIELD_DOCKER_LABEL_HARNESS:-shield-plugin-dev-site}
  com.fernleaf.run-id: ${SHIELD_DOCKER_CONTAINER_RUN_ID:-manual}
  com.fernleaf.lane: ${SHIELD_DOCKER_LABEL_LANE:-dev-site}
  com.fernleaf.lifecycle: ${SHIELD_DOCKER_CONTAINER_LIFECYCLE:-reusable}
  com.fernleaf.expires-at: ${SHIELD_DOCKER_CONTAINER_EXPIRES_AT:-1970-01-01T00:00:00+00:00}

x-shield-volume-labels: &shield-volume-labels
  com.fernleaf.harness: ${SHIELD_DOCKER_LABEL_HARNESS:-shield-plugin-dev-site}
  com.fernleaf.run-id: ${SHIELD_DOCKER_VOLUME_RUN_ID:-manual}
  com.fernleaf.lane: ${SHIELD_DOCKER_LABEL_LANE:-dev-site}
  com.fernleaf.lifecycle: ${SHIELD_DOCKER_VOLUME_LIFECYCLE:-reusable}
  com.fernleaf.expires-at: ${SHIELD_DOCKER_VOLUME_EXPIRES_AT:-1970-01-01T00:00:00+00:00}

x-shield-network-labels: &shield-network-labels
  com.fernleaf.harness: ${SHIELD_DOCKER_LABEL_HARNESS:-shield-plugin-dev-site}
  com.fernleaf.run-id: ${SHIELD_DOCKER_CONTAINER_RUN_ID:-manual}
  com.fernleaf.lane: ${SHIELD_DOCKER_LABEL_LANE:-dev-site}
  com.fernleaf.lifecycle: ${SHIELD_DOCKER_CONTAINER_LIFECYCLE:-reusable}
  com.fernleaf.expires-at: ${SHIELD_DOCKER_CONTAINER_EXPIRES_AT:-1970-01-01T00:00:00+00:00}

services:
  db:
    image: mysql:8.0
    labels: *shield-container-labels
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: ${SHIELD_LOCAL_SITE_DB_NAME:-shield_local_site}
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    volumes:
      - site-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptestpass"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.2}-apache
    labels: *shield-container-labels
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: testpass
      WORDPRESS_DB_NAME: ${SHIELD_LOCAL_SITE_DB_NAME:-shield_local_site}
    ports:
      - "${SHIELD_LOCAL_SITE_PORT:-8888}:80"
    volumes:
      - site-wp:/var/www/html
      - site-plugin:/var/www/html/wp-content/plugins/wp-simple-firewall
      - ./local-browser-runtime.ini:/usr/local/etc/php/conf.d/zz-shield-local-browser-runtime.ini:ro

  wp-cli:
    image: wordpress:cli-php${PHP_VERSION:-8.2}
    labels: *shield-container-labels
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: testpass
      WORDPRESS_DB_NAME: ${SHIELD_LOCAL_SITE_DB_NAME:-shield_local_site}
    volumes:
      - site-wp:/var/www/html
      - site-plugin:/var/www/html/wp-content/plugins/wp-simple-firewall
      - ../../:/app
      - ./local-browser-runtime.ini:/usr/local/etc/php/conf.d/zz-shield-local-browser-runtime.ini:ro

volumes:
  site-db:
    labels: *shield-volume-labels
  site-wp:
    labels: *shield-volume-labels
  site-plugin:
    labels: *shield-volume-labels

networks:
  default:
    labels: *shield-network-labels
